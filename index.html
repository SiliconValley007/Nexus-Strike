<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="description" content="NEXUS STRIKE — neon top-down arena shooter. Survive waves, smash bosses, chain combos. Play offline." />
    <meta name="theme-color" content="#07090f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
    <meta name="apple-mobile-web-app-title" content="NEXUS STRIKE" />
    <meta property="og:title" content="NEXUS STRIKE" />
    <meta property="og:description" content="Neon top-down arena shooter. Survive waves, smash bosses, chain combos." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://siliconvalley007.github.io/Nexus-Strike/" />
    <meta property="og:image" content="https://siliconvalley007.github.io/Nexus-Strike/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NEXUS STRIKE" />
    <meta name="twitter:description" content="Neon top-down arena shooter. Survive waves, smash bosses, chain combos." />
    <meta name="twitter:image" content="https://siliconvalley007.github.io/Nexus-Strike/icon-512.png" />
    <link rel="canonical" href="https://siliconvalley007.github.io/Nexus-Strike/" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <title>NEXUS STRIKE</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="c" role="img" aria-label="NEXUS STRIKE game arena"></canvas>
    <div id="ui">
      <div class="hud">
        <div>
          <div class="stat">Health<b id="hpT">100</b></div>
          <div class="hpwrap"><div class="hp" id="hpB"></div></div>
        </div>
        <div class="stat" style="text-align:center">
          Score<b id="scT" aria-live="polite">0</b>
          <small id="cbT">x1</small>
        </div>
        <div class="stat" style="text-align:right">
          Wave<b id="wvT" aria-live="polite">1</b>
        </div>
      </div>
      <button id="pauseBtn" type="button" aria-label="Pause">II</button>
      <button id="dashBtn" type="button" aria-label="Dash">DASH</button>
    </div>
    <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="ttl">
      <div class="panel">
        <h1 id="ttl">NEXUS STRIKE</h1>
        <div class="sub" id="ovSub">Top-Down Arena Shooter</div>
        <div class="row" id="diffRow">
          <button class="btn" type="button" id="bEasy" aria-label="Easy difficulty">EASY</button>
          <button class="btn pri" type="button" id="bNorm" aria-label="Normal difficulty">NORMAL</button>
          <button class="btn" type="button" id="bHard" aria-label="Hard difficulty">HARD</button>
        </div>
        <button class="btn pri" type="button" id="bPlay">PLAY</button>
        <button class="btn hidden" type="button" id="bResume">RESUME</button>
        <button class="btn" type="button" id="bRestart">RESTART</button>
        <div class="row">
          <button class="btn" type="button" id="bMusic" aria-label="Toggle music">MUSIC: ON</button>
          <button class="btn" type="button" id="bSfx" aria-label="Toggle sound effects">SFX: ON</button>
        </div>
        <button class="btn" type="button" id="bTitle">TITLE</button>
        <button class="btn hidden" type="button" id="bInstall" aria-label="Install app">INSTALL</button>
        <p class="hint" id="ovHint">
          WASD / sticks move · Mouse / right stick aim<br />Click / RT fire · Shift / Space / LB dash<br />Touch: left stick · right aim/fire · ESC / P pause
        </p>
      </div>
    </div>
    <script src="./game.js" defer></script>
  </body>
</html>
